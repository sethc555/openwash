# OpenWASH — technology catalog (normalized from the EAWAG Compendium 2nd ed)
#
# A queryable, provenance-tagged slice of the Compendium's 57 technologies —
# structured around the attributes that DISQUALIFY a technology at a site
# (water table, land, skilled labour, power, water, scale). This is the
# capability-query backbone: given site constraints, which technologies fit?
#
# `reuse_products` links a technology's outputs to the reuse-safety layer
# (data/reuse_safety.yaml + engine/dieoff.py) — so selection and safety are
# one system.
#
# Provenance: every technology cites its Compendium page. Numeric siting/land
# values are from the source sheet; `skilled_labour` / `land_demand` levels are
# the curator's classification of the sheet's prose (marked, not sourced).

meta:
  source: eawag_compendium
  functional_groups:
    U: User Interface
    S: Collection & Storage/Treatment
    C: Conveyance
    T: (Semi-)Centralized Treatment
    D: Use and/or Disposal
  # engine heuristics (NOT source data) used by select.py when a site supplies
  # a value the source expresses only qualitatively:
  heuristics:
    land_demand_high_threshold_m2_per_capita: 3   # 'high land_demand' disqualified below this

technologies:

  - id: U.1
    name: Dry Toilet
    group: U
    scale: [household]
    inputs: [faeces, urine]
    outputs: [excreta]
    reuse_products: []
    requires: {water: false, power: false, skilled_labour: low}
    siting: {}
    notes: "No urine diversion; mixed excreta drops to a pit/vault below. Waterless."
    source: {ref: eawag_compendium, page: 44}

  - id: U.2
    name: Urine-Diverting Dry Toilet (UDDT)
    group: U
    scale: [household, small_community]
    inputs: [faeces, urine]
    outputs: [faeces, urine]                       # diverts the two streams — each routed downstream
    reuse_products: []
    requires: {water: false, power: false, skilled_labour: low}
    siting: {}                                    # no deep pit — key advantage
    notes: "Waterless, above-ground. Diverts urine from faeces. Works where the water table is HIGH."
    source: {ref: eawag_compendium, page: 46}

  - id: S.1
    name: Urine Storage Tank / Container
    group: S
    scale: [household, small_community, community]
    inputs: [urine]
    outputs: [stored_urine]
    reuse_products: []
    requires: {water: false, power: false, skilled_labour: low}
    siting: {}
    notes: "Store ≥1 mo (≥6 mo for full sanitization); ~1.2 L urine/person/day."
    source: {ref: eawag_compendium, page: 58}

  - id: U.4
    name: Pour Flush Toilet
    group: U
    scale: [household]
    inputs: [faeces, urine, flushwater]
    outputs: [blackwater]
    reuse_products: []
    requires: {water: true, power: false, skilled_labour: low}
    siting: {}
    notes: "~2–3 L/flush. Needs a reliable small water supply."
    source: {ref: eawag_compendium, page: 50}

  - id: S.2
    name: Single Pit
    group: S
    scale: [household]
    inputs: [excreta, blackwater, faeces]
    outputs: [sludge]
    reuse_products: [sludge]
    requires: {water: false, power: false, skilled_labour: low}
    siting: {pit_depth_m: 3, clearance_above_water_table_m: 2, setback_from_water_m: 30}
    notes: "40–60 L/person/yr solids; lasts 20+ yr. Deep pit — disqualified by a high water table."
    source: {ref: eawag_compendium, page: 60}

  - id: S.3
    name: Single Ventilated Improved Pit (VIP)
    group: S
