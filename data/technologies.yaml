  # ── Conveyance (C) — bridge onsite collection to a managed OFFSITE service.
  #    Modeled as terminals that hand the product off to offsite FSM/sewerage;
  #    they require the site to actually HAVE that service (`offsite_service`).
  - id: C.2
    name: Human-Powered Emptying & Transport (to offsite)
    group: C
    scale: [household, small_community, community]
    inputs: [sludge, dried_faeces, compost, pit_humus]
    outputs: []
    reuse_products: []
    requires: {water: false, power: false, skilled_labour: low, offsite_service: true}
    siting: {}
    notes: "Manual pit emptying + cartage to a transfer station/treatment. Needs a functioning offsite FSM chain."
    source: {ref: eawag_compendium, page: 86}

