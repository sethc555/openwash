- id: barrier_treatment
  category: barrier_credit
  parameter: "Barrier: wastewater treatment"
  value: {value: {min: 1, max: 6}, unit: log10, sources: [{ref: who2006_vol2, page: 89, locator: "Table 4.3"}], claimed_tier: single_sourced}
- id: barrier_dieoff
  category: barrier_credit
  parameter: "Barrier: pathogen die-off on crop (per day withheld before harvest)"
  value: {value: {min: 0.5, max: 2}, unit: log10/day, sources: [{ref: who2006_vol2, page: 89, locator: "Table 4.3"}], claimed_tier: single_sourced}
- id: barrier_drip_low
  category: barrier_credit
