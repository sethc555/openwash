  value:
    value: "55-60 C for 1 month + 2-4 months maturation"
    unit: temp_time
    sources: [{ref: who2006_vol4, page: 84}]
    claimed_tier: single_sourced
  notes: "Alternative to the >50 C / >1 week minimum; more margin."
