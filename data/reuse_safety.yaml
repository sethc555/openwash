- id: barrier_cooking
  category: barrier_credit
  parameter: "Barrier: cooking"
  value: {value: {min: 6, max: 7}, unit: log10, sources: [{ref: who2006_vol2, page: 89, locator: "Table 4.3"}], claimed_tier: single_sourced}
- id: barrier_ppe
  category: barrier_credit
  parameter: "Barrier: PPE / handwashing"
  value: {value: "recommended but NOT credited as a log reduction", unit: none, sources: [{ref: who_ssp, locator: "Guidance Note 4.1"}], claimed_tier: single_sourced}

# ---- Storage / thermal sanitization: design target vs deployed reality ------
- id: composting_thermophilic
  category: storage_sanitization
  parameter: Thermophilic composting to sanitize excreta/faecal sludge
  target_vs_field:
    design_target:
      value: ">50 C for >1 week"
      unit: temp_time
      sources: [{ref: who2006_vol4, page: 89}, {ref: eawag_compendium, page: 146, locator: "D.4", restates: who_2006_reuse}]
      claimed_tier: single_sourced
    field:
      status: corroborated
      finding: "Engineered piles (FS + bulking agent, turned 7-daily) held 48-60 C for >38 d over 8 wk -> complete sanitization incl. viable helminth eggs."
      sources: [{ref: manga2020, locator: "results"}]
      tier: field_corroborated
      caveat: "Tropical-climate composting die-off is a recognised data gap (manga2023). Holds WHEN the thermophilic regime is actually reached and held uniformly."
  notes: "This is genuinely multi-lineage: WHO guideline + independent Manga field study agree."

- id: storage_passive_ambient
  category: storage_sanitization
  parameter: Ambient/passive storage to sanitize dry excreta (no fresh additions)
  target_vs_field:
    design_target:
      value:
        - {condition: "2-20 C", time: "1.5-2 years"}
        - {condition: ">20-35 C", time: ">1 year"}
        - {condition: "pH>9 (alkaline)", time: ">6 months"}
      unit: temp_time
      sources: [{ref: who2006_vol4, page: 90, locator: "Table 4.5"}, {ref: eawag_compendium, page: 70, locator: "S.7/D.3", restates: who_2006_reuse}]
      claimed_tier: single_sourced
    field:
      status: contradicted
      finding: "Deployed EcoSan latrines (Malawi), 12 mo post-sealing: hookworm 5-10 eggs/g (limit <=1); Ascaris still >1 egg/g in 12% of units (ROSE 1.5->2.3 before falling); Salmonella INCREASED 71->456 CFU/g (regrowth). Units never reached assumed regime: pH 8.7 not >12; NH3 ~90 not ~280 mg/L; no thermophilic phase."
      sources: [{ref: kumwenda2019, locator: "12-mo follow-up"}]
      tier: field_contradicted
      caveat: "Authors: ~6-month guidance is INSUFFICIENT; even >=12 mo did not fully sanitize. Single n=35 one-country study: strong existence proof of harm, weak as a distribution."
  notes: "THE reason design_target and field are separate fields. Do not ship the design number as a guarantee."

- id: urine_storage
  category: storage_sanitization
  parameter: Urine storage to permit unrestricted crop use
  value:
    value: "20 C for >=6 months -> all crops (>=1 month -> processed crops only; own-household use -> no storage)"
    unit: temp_time
    sources:
      - {ref: who2006_vol4, page: 91, locator: "Table 4.6"}
      - {ref: eawag_compendium, page: 58, locator: "S.1/D.2", restates: who_2006_reuse}
    claimed_tier: multi_corroborated
  notes: "Do NOT dilute stored urine; do not use near Schistosoma haematobium waters."

# ---- Siting constraints (the 'just dig a trench' bounds) --------------------
- id: siting_setback_from_water
  category: siting_constraint
  parameter: Minimum horizontal setback of pit/latrine from any drinking-water source
  value:
    value: 30
    qualifier: ">="
    unit: m
    sources:
      - {ref: sphere2018, page: 115, locator: "Excreta std 3.1"}
      - {ref: eawag_compendium, page: 60, locator: "S.2/S.3/D.7/D.8"}
    claimed_tier: multi_corroborated
  notes: "Default when no infiltration test; increase in fissured rock/limestone, decrease in fine soils."

- id: siting_clearance_water_table
  category: siting_constraint
  parameter: Minimum vertical clearance, pit bottom above wet-season groundwater table
  contested:
    candidates:
      - {value: 1.5, unit: m, sources: [{ref: sphere2018, page: 115, locator: "Excreta std 3.1"}]}
      - {value: 2.0, unit: m, sources: [{ref: eawag_compendium, page: 60, locator: "S.2 Single Pit"}]}
    resolution: use_most_conservative
    resolved: {value: 2.0, unit: m}
  notes: "Genuine 0.5 m disagreement between two respected sources. 1.75 m (the average) is nobody's recommendation. Both are defaults-when-no-infiltration-test."

