- id: barrier_disinfection
  category: barrier_credit
  parameter: "Barrier: produce disinfection"
  value: {value: 2, unit: log10, sources: [{ref: who2006_vol2, page: 89, locator: "Table 4.3"}], claimed_tier: single_sourced}
- id: barrier_peeling
  category: barrier_credit
  parameter: "Barrier: produce peeling"
