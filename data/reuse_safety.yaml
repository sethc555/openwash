# ---- helminth treatment requirement (Table 4.4) ----------------------------
- id: helminth_treatment_required
  category: log_reduction_requirement
  parameter: Helminth-egg reduction required by treatment vs raw wastewater load
  value:
    value:
      - {raw_eggs_per_L: 1000, treatment_log: 3}
      - {raw_eggs_per_L: 100, treatment_log: 2}
      - {raw_eggs_per_L: 10, treatment_log: 1}
    unit: log10
    sources: [{ref: who2006_vol2, page: 93, locator: "Table 4.4"}]
    claimed_tier: single_sourced
  notes: "All target verification <=1 egg/L. Produce washing adds 1 log if raw load higher."

# ---- cross-contamination loads (why urine/greywater need far less treatment) -
- id: crosscontamination_urine
  category: verification_threshold
  parameter: Faecal cross-contamination of source-separated urine
  value: {value: {mean: 9.1, sd: 5.6}, unit: mg faeces/L urine, sources: [{ref: who2006_vol4, page: 85}], claimed_tier: single_sourced}
  notes: "~5 log lower pathogen conc. than faeces -> urine typically needs only 2 log."
- id: crosscontamination_greywater
  category: verification_threshold
  parameter: Greywater faecal load
  value: {value: 0.04, unit: g faeces/person/day, sources: [{ref: who2006_vol4, page: 85}], claimed_tier: single_sourced}
  notes: "~1000-fold lower risk than wastewater."

