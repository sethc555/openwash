# OpenWASH v0.1 — Excreta / urine / wastewater reuse safety table
#
# The narrow, defensible first cut: the safety-critical thresholds that
# separate a working nutrient-cycling (ecosan) design from a disease vector.
#
# Claim shapes (see data/README.md for the full model):
#   value:          a single figure, corroborated by one or more sources
#   contested:      respected sources DISAGREE — both kept, never averaged
#   target_vs_field: design_target (guideline, under assumed conditions)
#                    is kept SEPARATE from field (deployed/verified reality)
#
# Rules the engine enforces:
#   - no naked numbers: every value block needs >=1 source with page/locator
#   - tier is COMPUTED from distinct source lineages, not asserted
#   - a source marked `restates:` does not count as independent corroboration

meta:
  id: reuse_safety
  version: 0.1.0
  binding_pathogen: Ascaris        # the hardest to kill; every storage/thermal rule is really an Ascaris-kill rule
  health_target: "<=1e-6 DALY per person per year"

claims:

# ---- Health-based targets --------------------------------------------------
- id: target_daly
  category: health_target
  parameter: Tolerable additional disease burden
  value:
    value: 1.0e-6
    qualifier: "<="
    unit: DALY/person/year
    sources:
      - {ref: who2006_vol4, page: 83}
      - {ref: who2006_vol2, page: 86, locator: "Table 4.2"}
      - {ref: who_ssp, locator: "glossary", restates: who_2006_reuse}
    claimed_tier: multi_corroborated
  notes: "Headline target. OCR mangles this as '10DALY'; read from PDF."

- id: design_infection_risk_rotavirus
  category: health_target
  parameter: Design tolerable infection risk (rotavirus, index organism)
  value:
    value: 1.0e-3
    unit: infections/person/year
    sources: [{ref: who2006_vol2, page: 79, locator: "Table 3.19"}]
    claimed_tier: single_sourced
  notes: "Equivalent to the 1e-6 DALY target; gives the 6/7-log design targets."

# ---- Verification thresholds (what 'treated' must measure) ------------------
- id: verify_faeces_helminth
  category: verification_threshold
  parameter: Treated faeces/sludge — viable helminth eggs
  value:
    value: 1
    qualifier: "<"
    unit: egg/g total solids
    sources:
      - {ref: who2006_vol4, page: 84}
      - {ref: eawag_compendium, page: 132, locator: "T.16 Co-Composting", restates: who_2006_reuse}
    claimed_tier: multi_corroborated
  notes: "The famous <=1 egg/g. Binding = Ascaris. Compendium cites WHO, not independent."

- id: verify_faeces_ecoli
  category: verification_threshold
  parameter: Treated faeces/sludge — E. coli
  value:
    value: 1000
    qualifier: "<"
    unit: CFU/g total solids
    sources: [{ref: who2006_vol4, page: 84}]
    claimed_tier: single_sourced

- id: verify_wastewater_unrestricted_helminth
  category: verification_threshold
  parameter: Wastewater, unrestricted irrigation — helminth eggs
  value:
    value: 1
    qualifier: "<="
    unit: egg/L
    sources:
      - {ref: who2006_vol2, page: 85, locator: "Table 4.1"}
      - {ref: who2006_vol4, page: 84}
    claimed_tier: multi_corroborated
  notes: "Mean over season, met in >=90% of samples."

- id: verify_children_tighten
  category: verification_threshold
  parameter: Helminth limit where children <15 are exposed
  value:
    value: 0.1
    qualifier: "<="
    unit: egg/L
    sources: [{ref: who2006_vol2, page: 85, locator: "Table 4.1"}]
    claimed_tier: single_sourced

# ---- Required pathogen reduction by exposure scenario ----------------------
- id: logred_unrestricted_leaf
  category: log_reduction_requirement
  parameter: Required pathogen reduction
  scenario: {use: unrestricted_irrigation, crop: leaf}
  value:
    value: 6
    unit: log10
    sources:
      - {ref: who2006_vol4, page: 85}
      - {ref: who2006_vol2, page: 85, locator: "Table 4.1"}
      - {ref: who_ssp, locator: "Fig 4.1", restates: who_2006_reuse}
    claimed_tier: multi_corroborated       # engine will DOWNGRADE this — 3 docs, 1 lineage
  notes: "Rotavirus index. Lettuce. My synthesis over-claimed '3 independent'; see computed tier."

- id: logred_unrestricted_root
  category: log_reduction_requirement
  parameter: Required pathogen reduction
  scenario: {use: unrestricted_irrigation, crop: root}
  value:
    value: 7
    unit: log10
    sources:
      - {ref: who2006_vol4, page: 85}
      - {ref: who2006_vol2, page: 85, locator: "Table 4.1"}
      - {ref: who_ssp, locator: "Fig 4.1", restates: who_2006_reuse}
    claimed_tier: multi_corroborated
  notes: "Onions. Highest crop requirement."

- id: logred_restricted_labour
  category: log_reduction_requirement
  parameter: Required pathogen reduction
  scenario: {use: restricted_irrigation, labour: labour_intensive}
  value: {value: 4, unit: log10, sources: [{ref: who2006_vol2, page: 85, locator: "Table 4.1"}], claimed_tier: single_sourced}

- id: logred_restricted_mechanized
  category: log_reduction_requirement
  parameter: Required pathogen reduction
  scenario: {use: restricted_irrigation, labour: highly_mechanized}
  value: {value: 3, unit: log10, sources: [{ref: who2006_vol2, page: 85, locator: "Table 4.1"}], claimed_tier: single_sourced}

- id: logred_drip_low
  category: log_reduction_requirement
  parameter: Required pathogen reduction
  scenario: {use: localized_drip, crop: low_growing}
  value: {value: 4, unit: log10, sources: [{ref: who2006_vol2, page: 85, locator: "Table 4.1"}], claimed_tier: single_sourced}

- id: logred_drip_high
  category: log_reduction_requirement
  parameter: Required pathogen reduction
  scenario: {use: localized_drip, crop: high_growing}
  value: {value: 2, unit: log10, sources: [{ref: who2006_vol2, page: 85, locator: "Table 4.1"}], claimed_tier: single_sourced}

