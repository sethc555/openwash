disclaimer: >-
  OpenWASH is a screen, not a certifier — a decision aid that rules out unsafe reuse designs and states
  what to measure. It is not a medical device, a guarantee of safety, or a substitute for testing before
  reuse, and it does not address non-pathogen (chemical / antimicrobial-resistance) hazards. Independent;
  not affiliated with or endorsed by any cited organization. Developed with AI assistance (disclosed).
